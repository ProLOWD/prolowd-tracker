    { id: 359, date: "2026-07-19", player: "Jalen Crutcher", type: "Milestone", detail: "BIRTHDAY CLINCHER: 29 pts / 8 ast / 6 reb - Ponce Leones 100-86 W over Atleticos de San German to win the series 4-1. Crutcher closes out the top seed on his birthday; Ponce advances to the Conference B Final vs Santeros de Aguada (opens July 25)." },
    { id: 360, date: "2026-07-19", player: "Jhery Matos", type: "Announcement", detail: "LNB FINAL: Gigantes 91-80 W in Game 6 to win the Copa Banreservas 4-2; Metros de Santiago finish RUNNERS-UP for a second straight year. After Matos' G1 heroics, Gigantes took G2-G4, Metros forced a Game 6 with a G5 win, but Charles Brown Jr (27 pts, Finals MVP) closed it out. Season over for Matos." },
    { id: 361, date: "2026-07-19", player: "Malachi Smith", type: "Announcement", detail: "SEASON OVER: Santeros de Aguada 101-94 W in Game 6 eliminate the Arecibo Capitanes 4-2 in the BSN Conference B semifinal. Arecibo rallied from 21 down to briefly lead late in the third but Aguada pulled away. Rafael Pinzon led Arecibo with 30." },

    { id: 363, date: "2026-07-18", player: "Nate Santos", type: "Milestone", detail: "NBA SUMMER LEAGUE FINALE: 13 pts / 6 reb / 1 ast / 1 stl in the Wolves' last Vegas game. Finished Summer League shooting 17-33 from three (51.5% on 6+ attempts per game) - a head-turning case for a training camp invite per @ProLOWD." },
    { id: 364, date: "2026-07-19", player: "Koby Brea", type: "Game", detail: "NBA SUMMER LEAGUE FINALE: 6 pts / 6 reb / 3 ast - Suns 81-86 L to Spurs in their last Vegas game. Closes Brea's five-game Summer League." },
    { id: 365, date: "2026-07-25", player: "Jalen Crutcher", type: "Game", detail: "CONFERENCE B FINAL G1: team-high 12 pts / 3 ast / 2 reb - Ponce Leones 70-93 L at Santeros de Aguada. Ivan Gandia torched Ponce with 8 threes for 24 (game MVP); the Leones shot 5-23 from deep with 17 turnovers. Aguada leads 1-0; G2 July 27 at the Pachin Vicens." },
    { id: 366, date: "2026-07-27", player: "Dyshawn Pierre", type: "Signing", detail: "Signed with Galatasaray (Turkish BSL) for 2026-27, per RealGM's transaction wire (late July). Returns to Turkey after one VTB season at UNICS Kazan - and crosses the Istanbul rivalry after five years and three Turkish titles at Fenerbahce." },
    { id: 367, date: "2026-07-21", player: "Enoch Cheeks", type: "Signing", detail: "RE-SIGNS with the Antwerp Windrose Giants for 2026-27 - 'Here to stay' per the club, staying alongside Murray, Van Drom, Tumba, Kesteloot and De Knight despite foreign interest. Will defend his BNXT League title and play Champions League." },
    { id: 368, date: "2026-07-22", player: "Isaac Jack", type: "Game", detail: "12 pts / 5 reb / 2 ast / 1 stl - Edmonton Stingers 94-96 L (CEBL). Second-best scoring night of his pro season in a two-point heartbreaker." },
    { id: 369, date: "2026-07-23", player: "Scoochie Smith", type: "Signing", detail: "Signs with Gaziantep Basketbol (Turkish TBL) for 2026-27, per Turkish media (@PotaAltiTV via basketfaul.com.tr). Stays in Turkey after captaining Manisa in the BSL." },
    { id: 370, date: "2026-07-26", player: "Isaac Jack", type: "Milestone", detail: "PLAYOFF BERTH CLINCHED: 5 pts / 6 reb / 1 ast - Edmonton Stingers 100-89 W over the Calgary Surge at the Expo Centre (CEBL). The win secured Edmonton's postseason spot and eliminated Calgary - 'Surge 2 playoffs!' per @ED_Stingers. CEBL playoffs begin Aug 6." },
    { id: 371, date: "2026-07-27", player: "Jalen Crutcher", type: "Game", detail: "CONFERENCE B FINAL G2: Ponce Leones 87-80 W over Santeros de Aguada at the Pachin Vicens to even the series 1-1. Ponce opened on a 7-0 run and led by as many as 18. Jezreel De Jesus 18 pts/11 ast, Thomas Robinson 18/8, Brady Manek 15. (Crutcher individual line not reported in game coverage.)" },
    { id: 372, date: "2026-07-29", player: "Jalen Crutcher", type: "Game", detail: "CONFERENCE B FINAL G3: 16 pts - Ponce Leones 89-100 L at Santeros de Aguada. Joel Soriano erupted for 32 to put Aguada up 2-1 in the series." },
    { id: 373, date: "2026-07-31", player: "Jalen Crutcher", type: "Game", detail: "CONFERENCE B FINAL G4: 12 pts / 6 ast / 2 reb, named Jugador Destacado - Ponce Leones 89-96 L to Santeros de Aguada at the Pachin Vicens. Aguada's first road win of the series puts Ponce on the brink at 3-1. Jacob Wiley 21 and Rigoberto Mendoza 20 led Aguada; Tjader Fernandez 26 and De Jesus 25 for Ponce." },
    { id: 374, date: "2026-08-02", player: "Jalen Crutcher", type: "Milestone", detail: "DOUBLE-OT SURVIVAL + GAME MVP: 16 pts / 13 ast / 6 reb, named MVP del Juego - Crutcher drove for the go-ahead layup with 15 seconds left in the second overtime, Ponce Leones 106-105 W at Santeros de Aguada in Conference B Final G5. Ponce trailed by 11 in the third and staved off elimination; De Jesus tied it at 85 with three FTs late in regulation and finished with 25. Aguada leads the series 3-2." },
    { id: 375, date: "2026-08-02", player: "Isaac Jack", type: "Game", detail: "6 pts / 5 reb / 1 stl - Edmonton Stingers 89-96 L in the regular-season finale (CEBL). Stingers head into the postseason as a road team: 'Playoffs start Thursday in Vancouver' per @ED_Stingers (Aug 6)." },
    { id: 376, date: "2026-08-04", player: "Jalen Crutcher", type: "Announcement", detail: "SEASON OVER: 20 pts / 5 ast / 4 reb - Crutcher went down swinging, but Santeros de Aguada won Game 6 95-89 to take the Conference B Final 4-2 and eliminate the Ponce Leones. Rigoberto Mendoza sealed it with 28/10 ast/6 reb. Aguada reaches its first BSN final since 2019 (when it also beat Ponce in six for its only title) and faces defending champion Bayamon in La Final BRAVA. A brilliant playoff run for Crutcher ends one series short." },
    { id: 377, date: "2026-08-06", player: "Isaac Jack", type: "Announcement", detail: "SEASON OVER: 4 pts / 2 reb / 1 blk - Vancouver Bandits 92-83 W over Edmonton in the CEBL Western Conference semifinal at Langley Events Centre. Nick Hornsby led the Stingers with 22 - the only Edmonton player above 11. Jack's rookie CEBL season ends in the playoffs." },
    { id: 378, date: "2026-08-10", player: "Jacob Conner", type: "Signing", detail: "FIRST PRO CONTRACT: Signs with Veertien Mie Basketball (Japan B3, Yokkaichi) for 2026-27 - announced Aug 10. The 6-8 forward and Alter HS grad played two seasons at Marshall and two at Dayton, and is the first senior from Dayton's 2025-26 roster to sign overseas. Joins Devin Oliver in Japanese B3." },
    { id: 379, date: "2026-08-25", player: "Malachi Smith", type: "Signing", detail: "Signs with CSM Petroleum Ploiesti (Romania, BCR Liga Nationala) for 2026-27 - his first European contract. Mali and fellow American Nicholas Lynch are the club's first foreign signings of the season, per the official announcement. Bronx > Dayton > UConn > Arecibo > Ploiesti in his first 18 months as a pro." },
    { id: 380, date: "2026-07-05", player: "Kostas Antetokounmpo", type: "Signing", detail: "SIGNS PERMANENTLY WITH ARIS: after Olympiacos terminated his contract (Jun 27), Aris signed him outright to a deal through 2029 (three years, option on the third). Converts January's loan into a long-term home; Aris also added Khem Birch up front." },
    { id: 381, date: "2026-08-28", player: "Mustapha Amzil", type: "Signing", detail: "Signs with Yukatel Denizli Basket (Turkish BSL) for 2026-27, moving up from KB Trepca. Denizli cited his 14.8 PPG / 7.4 RPG / 2.2 APG / 1.4 SPG season plus the Kosovo Cup title and Cup Final Four MVP award." },
    { id: 382, date: "2026-06-09", player: "Ibi Watson", type: "Game", detail: "BBL PLAYOFFS SF G5: 16 pts / 1 reb / 1 ast - ALBA Berlin 97-66 W at Uber Arena. Only Bamberg player in double figures; ALBA takes the series 3-2 and advances to the BBL Finals vs Bayern Munich. Bamberg's season ends. (Backfilled - was missing from this file.)" },
    { id: 383, date: "2026-06-13", player: "Ibi Watson", type: "Milestone", detail: "Signed with ratiopharm Ulm (BBL) for the 2026-27 season - joining the team Bamberg swept 3-0 in this year's quarterfinals. (Backfilled - was missing from this file.)" },
    { id: 384, date: "2026-09-07", player: "Jordan Sibert", type: "Signing", detail: "Signs with SC Braga (Portugal, Liga Betclic) for 2026-27 - stays in the Portuguese top flight after a strong debut season at UD Oliveirense. Braga earned promotion to the Liga Betclic for the first time in club history in 2025 and reached the playoff quarterfinals last season, where Benfica knocked them out." },
    { id: 385, date: "2026-09-13", player: "Scoochie Smith", type: "Game", detail: "TBL OPENER - team-high 16 pts / 3 ast / 3 reb (5 TO) in Gaziantep Basketbol's 82-68 loss at Kecioren Belediyesi Baglum, Week 1 of the Turkiye Basketbol Ligi. The first official regular-season game by any Flyer in 2026-27. Gaziantep shot 4-17 from three and missed 16 free throws; coach Sinan Celik called the defensive effort unacceptable. Gaziantep hosts Finalspor next." },
    { id: 386, date: "2026-09-15", player: "Josh Cunningham", type: "Signing", detail: "Signs with Club Biguá (Uruguay, Liga Uruguaya de Basketball) for the 2026-27 LUB season - a RETURN to a club he has played for before, announced as 'Bienvenido a casa (de nuevo).' Ends his free agency after being released mid-season by the Tangerang Hawks in Indonesia." },
    { id: 387, date: "2026-05-26", player: "Elijah Weaver", type: "Announcement", detail: "SEASON OVER (backfilled correction): Weaver spent 2025-26 with Defensor Sporting (Uruguay, LUB), not Abejas de Leon. Final game: 8 pts / 3 reb / 2 ast in 25 min in a playoff loss to Penarol. Season line: 18.9 PPG / 3.3 RPG / 3.0 APG / 1.4 SPG in 25 GP on 52.9% FG and 40.9% 3PT. Career high 33 pts in a 98-92 home W vs Aguada (Feb 20), per Proballers." },
    { id: 388, date: "2026-06-25", player: "Moulaye Sissoko", type: "Signing", detail: "RE-SIGNS with Tours Metropole Basket (NM1) for 2026-27 - one of two interior players the Knights brought back for continuity in the paint, per BeBasket. (Backfilled - was missing from this file.)" },
    { id: 389, date: "2026-07-17", player: "Kobe Elvis", type: "Signing", detail: "Signs with NKA Universitas Pecs (Hungary, NB I/A) for 2026-27 - announced alongside New Zealand national-team center James Moors and American guard Kieffer Punter as the club's three imports. Leaves BK Olomoucko after one Czech NBL season. (Backfilled - was missing from this file.)" },
    { id: 390, date: "2026-08-25", player: "Rodney Chatman", type: "Release", detail: "Departs the Sheffield Sharks - named with Prentiss Nixon and Dirk Williams as the 'play-making triumvirate' moving on as coach Atiba Lyons finalised the 2026-27 roster (Yorkshire Post, Aug 25). Leaves after winning the SLB Cup. Now a free agent." },
    { id: 391, date: "2026-09-20", player: "Posh Alexander", type: "Release", detail: "Not on BK Armex Energy Decin's 2026-27 roster (Czech NBL), and his agency (Dagger Basketball) lists him as AVAILABLE. Free agent after a rookie season in which he led the Czech NBL in steals." },
    { id: 392, date: "2026-09-20", player: "Vincent Sanford", type: "Release", detail: "Listed among Fos Provence Basket's departures for 2026-27 in BeBasket's Elite 2 transfer tracker - Fos moves up to Elite 2 without him after his spring stint (16.0 PPG, NM1 Round 16 Player of the Week). New club not yet reported." },
    { id: 393, date: "2026-09-15", player: "Moulaye Sissoko", type: "Game", detail: "COUPE DE FRANCE: 10 pts / 9 reb / 1 ast in 22 min - Tours 92-85 W over Vitre. First competitive game of 2026-27 after re-signing with the Knights." },
    { id: 394, date: "2026-09-15", player: "Mustapha Amzil", type: "Game", detail: "BCL QUALIFYING (Round of 16, Samokov, Bulgaria): RASTA Vechta 101-98 W over Yukatel Denizli Basket. Denizli rallied from 82-69 down to tie it 95-95 inside the final minute but fell short; Victor Bailey Jr. scored 33. Denizli drops to the FIBA Europe Cup group stage. (Amzil individual line not reported.)" },
    { id: 395, date: "2026-09-19", player: "Zed Key", type: "Game", detail: "CZECH NBL OPENER: 7 pts / 3 reb / 1 ast in 20 min (5-9 FT) - BK KVIS Pardubice 85-79 W over Basket Brno. Year 2 in Pardubice starts with a win." },
    { id: 396, date: "2026-09-19", player: "Scoochie Smith", type: "Game", detail: "DOUBLE-OT WINNER: 9 pts / 12 ast / 3 reb - Gaziantep Basketbol 91-89 W over Finalspor in its TBL home opener. Scoochie buried the go-ahead three with about a minute left in the second overtime (91-88) after hitting 1-of-2 FTs late in the first OT. Gaziantep's first win of the season; Sarp Coskun had 28." },
    { id: 397, date: "2026-09-19", player: "Malachi Smith", type: "Game", detail: "PRESEASON: 23 pts (7-13 FG, 1-3 3PT, 8-9 FT) / 4 ast / 2 reb / 1 stl, +10 in 30:32 - started and wore the captain's (C) designation as CSM BBA Petrolul Ploiesti beat CSM Corona Brasov 103-93 at Sala Olimpia in the final tune-up before the Liga Nationala season. Mali and Matthew Hayman (27) combined for 50. (Per FIBA box score.)" },
    { id: 398, date: "2026-09-19", player: "Jordan Sibert", type: "Game", detail: "PRESEASON (Trofeu Stromp): 24 pts (4-7 3PT) / 3 ast - Sibert's three with 2 seconds left tied it 85-85 and forced overtime, but Sporting won 97-94 in OT. Strong first look in SC Braga colors." },
    { id: 399, date: "2026-09-20", player: "Ibi Watson", type: "Game", detail: "BBL OPENER: 14 pts / 5 reb / 3 ast - ratiopharm Ulm 86-77 W over MHP Riesen Ludwigsburg in the Baden-Wurttemberg derby. Ulm won it with a 28-point fourth quarter; Watson was third in scoring behind Rataj (20) and Shittu (15/17). Winning debut for his new club." },
    { id: 400, date: "2026-09-18", player: "Moulaye Sissoko", type: "Game", detail: "NM1 OPENER: Played in Tours Metropole Basket's opening loss at Angers - no individual line recorded. The Knights 'lost their way and the physical battle' after halftime, per La Nouvelle Republique, and bounced back a week later against Lorient." },
    { id: 401, date: "2026-09-23", player: "Zed Key", type: "Game", detail: "ROUND 2 ROUT: 12 pts / 6 reb - BK KVIS Pardubice 100-54 W at BK Olomoucko (Czech NBL). Pardubice led 72-39 through three quarters." },
    { id: 402, date: "2026-09-25", player: "Ibi Watson", type: "Game", detail: "FIRST ROAD WIN: 14 pts / 5 reb / 3 ast - ratiopharm Ulm 93-78 W at Phoenix Hagen (BBL Matchday 2), per @ProLOWD. Ulm's first away win of the season, with five players in double figures." },
    { id: 403, date: "2026-09-25", player: "Moulaye Sissoko", type: "Game", detail: "14 REBOUNDS: 8 pts / 14 reb - Tours Metropole Basket 84-80 W over CEP Lorient (NM1). Sissoko dominated the paint after halftime as Tours bounced back from its opening loss at Angers." },
    { id: 404, date: "2026-09-26", player: "Dyshawn Pierre", type: "Game", detail: "BSL OPENER: 16 pts on 7-of-9 shooting - Galatasaray 102-79 W over Cayirova Belediyesi. Coach Pozzecco credited a switch to zone defense as the decisive move; Galatasaray's first official game of 2026-27." },
